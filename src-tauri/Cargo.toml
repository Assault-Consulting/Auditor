[package]
name = "palimpsests-auditor"
version = "0.0.1"
description = "Palimpsests Auditor — the reader-side shell for PALA-1 audit chains"
authors = ["Assault Consulting"]
license = "Apache-2.0"
edition = "2021"

[lib]
name = "palimpsests_auditor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
