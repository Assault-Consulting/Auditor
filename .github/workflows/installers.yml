# Installers for the live desktop check (R3). Windows first.
#
# The sidecar is frozen with PyInstaller into one executable and shipped
# beside the application through Tauri's externalBin, so the machine needs
# no Python. The frozen binary is started and driven through the paths an
# installed application takes before the installer is built: a build that
# imports cleanly and then lacks what it reads at run time fails here, not
# on the desk.
#
# Unsigned. Windows SmartScreen warns on first run ("More info" → "Run
# anyway"). Signing is Phase 5.
#
# Outside ci-complete on purpose: it is not a merge gate, it makes a file.
name: installers

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    paths:
      - ".github/workflows/installers.yml"
      - "sidecar/packaging/**"
      - "sidecar/tests/smoke_frozen_sidecar.py"
      - "src-tauri/src/sidecar.rs"
      - "src-tauri/tauri.windows-installer.json"

permissions:
  contents: read

concurrency:
  group: installers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      # A regular install, not editable: PyInstaller follows an editable
      # install's path hook unreliably, and the binary must carry the
      # sidecar's own code.
      - name: install the sidecar and PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install ./sidecar "pyinstaller>=6.11"

      # Out of the way of the frontend: Vite builds into dist/ and empties
      # it first, and a frozen binary there is deleted — or, still running,
      # refuses to be.
      - name: freeze the sidecar
        run: >
          pyinstaller --noconfirm --onefile --name auditor-sidecar
          --distpath build-sidecar/dist --workpath build-sidecar/work --specpath build-sidecar
          --collect-all palimpsests
          --copy-metadata palimpsests
          --copy-metadata fastapi
          --collect-submodules uvicorn
          --collect-submodules keyring
          --collect-submodules auditor_sidecar
          sidecar/packaging/entry.py

      - name: drive the frozen sidecar
        env:
          PYTHONIOENCODING: utf-8
        run: python sidecar/tests/smoke_frozen_sidecar.py build-sidecar/dist/auditor-sidecar.exe

      - name: place it for the bundler
        shell: bash
        run: |
          mkdir -p src-tauri/binaries
          cp build-sidecar/dist/auditor-sidecar.exe src-tauri/binaries/auditor-sidecar-x86_64-pc-windows-msvc.exe

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: 20

      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda  # v4.1.0
        with:
          version: 9

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          workspaces: src-tauri
          save-if: ${{ github.ref_name == 'main' }}

      - name: install frontend deps
        run: pnpm install --no-frozen-lockfile

      - name: generate placeholder icons
        run: |
          pip install pillow
          python scripts/gen-placeholder-icons.py

      - name: build the installer
        run: pnpm tauri build --config src-tauri/tauri.windows-installer.json

      - name: digest
        shell: bash
        run: |
          cd src-tauri/target/release/bundle/nsis
          ls -la
          for f in *.exe; do sha256sum "$f" > "$f.sha256"; done
          cat *.sha256

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: palimpsests-auditor-windows-x64
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.sha256
          if-no-files-found: error
          retention-days: 30
