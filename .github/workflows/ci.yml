name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least-privilege default: CI only needs to read the repo. Declared at the top
# level, with nothing more granted per job, so a compromised action cannot
# write to the repository or mint a token it was not given.
permissions:
  contents: read

jobs:
  # The scaffold arrives over several pull requests, so for a while this
  # workflow describes more of the repository than exists. Two ways to handle
  # that, and only one of them is honest.
  #
  # Leaving every job to fail until the last piece lands makes CI red on every
  # pull request for weeks, which trains everyone to merge past the red mark —
  # and once red is the normal colour, the first real failure is invisible.
  #
  # So each job is gated on the component it checks, and this job publishes
  # what is present. ci-complete prints the inventory on every run, so a green
  # tick is never anonymous: it always says which checks ran and which had
  # nothing to check. That is the same rule the ADR-0001 scan follows — it
  # reports how many files it scanned, because a guard that passes because it
  # looked at nothing is worse than no guard.
  inventory:
    name: inventory
    runs-on: ubuntu-latest
    outputs:
      sidecar: ${{ steps.probe.outputs.sidecar }}
      frontend: ${{ steps.probe.outputs.frontend }}
      tauri: ${{ steps.probe.outputs.tauri }}
      licenses: ${{ steps.probe.outputs.licenses }}
      desktop: ${{ steps.touched.outputs.desktop }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Full history: the desktop probe below diffs against the base of
          # the pull request, and a shallow clone has no base to diff against.
          fetch-depth: 0

      - id: probe
        name: which components are present
        run: |
          probe() {  # $1 = name, $2 = path that must exist
            if [ -e "$2" ]; then
              echo "$1=true" >> "$GITHUB_OUTPUT"
              echo "present : $1  ($2)"
            else
              echo "$1=false" >> "$GITHUB_OUTPUT"
              echo "ABSENT  : $1  ($2) — dependent checks will not run"
            fi
          }
          probe sidecar  sidecar/pyproject.toml
          probe frontend package.json
          probe tauri    src-tauri/Cargo.toml
          probe licenses LICENSES

      # Does this change touch anything the desktop build actually covers?
      #
      # The Linux leg of `build` installs webkit, gtk and their development
      # headers — 55 MB from an Ubuntu mirror that has taken down five runs
      # in one day. Four attempts to tune timeouts around that failed,
      # because the problem is not how long we wait: it is that a pull
      # request touching only the Python sidecar has no reason to be
      # downloading a GUI toolkit at all.
      #
      # So the desktop toolchain runs when the change could plausibly affect
      # it, and not otherwise. The list is deliberately generous — building
      # unnecessarily costs minutes, skipping wrongly costs a broken `main` —
      # and it includes this workflow itself, so a change to the build steps
      # always exercises them.
      #
      # Outside a pull request there is no base to diff against, so it always
      # runs. That covers pushes to main and manual dispatches.
      - id: touched
        name: does this change touch the desktop stack?
        run: |
          desktop_paths='^(src/|src-tauri/|package\.json|pnpm-lock\.yaml|tsconfig.*\.json|index\.html|vite\.config\.ts|scripts/gen-placeholder-icons\.py|\.github/workflows/)'

          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "desktop=true" >> "$GITHUB_OUTPUT"
            echo "not a pull request — the desktop build runs unconditionally"
            exit 0
          fi

          base='${{ github.event.pull_request.base.sha }}'
          changed="$(git diff --name-only "$base" HEAD)"
          echo "files changed against ${base:0:8}:"
          echo "$changed" | sed 's/^/  /'

          if echo "$changed" | grep -qE "$desktop_paths"; then
            echo "desktop=true" >> "$GITHUB_OUTPUT"
            echo
            echo "touches the desktop stack — build will run:"
            echo "$changed" | grep -E "$desktop_paths" | sed 's/^/  /'
          else
            echo "desktop=false" >> "$GITHUB_OUTPUT"
            echo
            echo "no desktop-stack paths touched — build will be skipped"
          fi

  lint:
    name: lint
    needs: inventory
    if: needs.inventory.outputs.sidecar == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      # Lint WITHOUT an editable install. With the package pip-installed,
      # ruff's isort classifies it as third-party and regroups first-party
      # imports differently than the src-layout heuristic does — passing
      # locally, failing only in CI. Linting a plain checkout keeps the
      # classification deterministic; `no-sections` in the isort config
      # closes the other half of the same hole.
      - name: install ruff only
        run: |
          python -m pip install --upgrade pip
          pip install ruff==0.16.2

      - name: ruff
        run: |
          ruff --version
          ruff check --output-format=full sidecar scripts

  api-client:
    name: api-client
    needs: inventory
    if: needs.inventory.outputs.sidecar == 'true'
    runs-on: ubuntu-latest
    # The frontend's types are generated from the sidecar's OpenAPI schema, so
    # a response model changing shape becomes a TypeScript compile error
    # rather than a field that silently renders empty. That only holds if the
    # committed client actually matches the models, so this regenerates and
    # diffs — the same discipline the upstream project applies to its test
    # vectors, and for the same reason: a hand-edited generated artifact makes
    # the guarantee unfalsifiable.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: install sidecar
        run: |
          python -m pip install --upgrade pip
          pip install -e "sidecar"

      - name: generated client is up to date
        run: python scripts/generate_api_client.py --check

  no-wire-parsing:
    name: no-wire-parsing
    runs-on: ubuntu-latest
    # ADR-0001 made mechanical. Every PALA-1 fact this application renders
    # comes from a verifier call; nothing here parses container bytes. The
    # violation always arrives as a small, locally-reasonable helper inside
    # a larger PR, when the deadline is close. A grep does not get tired.
    #
    # Ungated: the scan handles an empty tree itself and says so, rather than
    # printing "ok" over a set of zero files.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: scan for wire-parsing primitives outside the seam
        run: |
          if [ -f scripts/check_no_wire_parsing.sh ]; then
            bash scripts/check_no_wire_parsing.sh
          else
            echo "ABSENT: scripts/check_no_wire_parsing.sh — nothing scanned"
          fi

  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    needs: inventory
    if: needs.inventory.outputs.sidecar == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-14, windows-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: install sidecar (base + dev)
        run: |
          python -m pip install --upgrade pip
          pip install -e "sidecar[dev]"

      - name: pytest
        run: pytest sidecar -q

  build:
    name: build (${{ matrix.platform }})
    needs: inventory
    if: >-
      needs.inventory.outputs.frontend == 'true'
      && needs.inventory.outputs.tauri == 'true'
      && needs.inventory.outputs.desktop == 'true'
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-22.04, macos-14, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: 20

      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda  # v4.1.0
        with:
          version: 9

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"

      # Refreshing the index and installing 55 MB of packages are different
      # operations with different failure modes, so they are separate steps.
      # Only the refresh carries a bound; see the note on each.

      # Which host, not how long.
      #
      # Every failing log has the same shape: four rounds of `Ign:` against
      # azure.archive.ubuntu.com across all four suites, then a fallback to
      # archive.ubuntu.com, which answers — in one run it delivered 27.4 MB
      # in 3 seconds. The acquire timeouts never fire because the mirror is
      # not stalling a connection; it is declining the request, and apt
      # dutifully retries a host that has already said no.
      #
      # Four bounds were tried before anyone asked which mirror was being
      # waited on. This drops the one that has never answered on a bad day
      # and keeps the one that has, which is a change to the question rather
      # than another answer to the wrong one.
      #
      # The list is printed because it is the evidence for whoever looks next:
      # if this stops helping, the log says what apt was actually pointed at
      # rather than leaving it to be inferred.
      - name: prefer a mirror that answers
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' \
              /etc/apt/apt-mirrors.txt
            echo "mirrorlist now:"; cat /etc/apt/apt-mirrors.txt
          else
            echo "no /etc/apt/apt-mirrors.txt on this image — leaving sources alone"
          fi

      - name: apt index
        if: matrix.platform == 'ubuntu-22.04'
        # Ten minutes, not five. The refresh took 3 seconds on one run and
        # 2 minutes 3 seconds on the next, on the same mirror — so a bound
        # anywhere near the healthy figure is a bound that will fire on a
        # slow day. This one only catches a mirror that has stopped
        # answering entirely, which is the failure it was added for.
        timeout-minutes: 10
        run: |
          sudo apt-get update \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=20 \
            -o Acquire::https::Timeout=20

      - name: linux system deps
        if: matrix.platform == 'ubuntu-22.04'
        # NO step timeout, deliberately, after two attempts to set one made
        # things worse.
        #
        # The evidence, in order: six minutes killed an install that was
        # downloading normally; fifteen minutes killed one that ran 15m04s.
        # Before either bound existed, this step completed inside the job's
        # 30-minute budget on every green run. Two guesses, two regressions —
        # the honest conclusion is that the healthy duration of this step is
        # highly variable and nobody here knows its distribution.
        #
        # A bound below the real duration is worse than no bound: it converts
        # a slow success into a certain failure, every time, which is exactly
        # the "red is the normal colour" state this workflow was designed to
        # avoid. So the job's 30 minutes governs until there is a measured
        # figure to set a bound from.
        #
        # The thing actually worth doing about a slow mirror is caching the
        # archives between runs. That is a separate change with its own
        # failure modes, and it should be made on evidence rather than
        # stacked on top of two failed guesses.
        run: |
          # --no-install-recommends drops the runtime-only stack — gstreamer,
          # pipewire, the desktop portals — which a webkit application needs
          # to RUN a window. This job only compiles against the development
          # headers and never starts one.
          #
          # Measured rather than assumed, and the measurement is unflattering:
          # on a non-jammy box the same four packages resolve to 108 with
          # recommends and 103 without. Most of the runner's 130 are hard
          # dependencies and stay. So this is a small, principled reduction —
          # do not install what you never execute — and it is not a fix for
          # slowness: the run that removed the recommended set still spent
          # over fifteen minutes here.
          #
          # If something here turns out to be genuinely required, the failure
          # is a compile error naming the missing header, not a mystery.
          sudo apt-get install -y --no-install-recommends \
            -o Acquire::Retries=3 \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: install frontend deps
        run: pnpm install --no-frozen-lockfile

      # The Tauri context macro reads icons/icon.png, and tauri-build wants
      # icon.ico on Windows — even with bundling disabled. Until a real logo
      # lands, generate branded placeholders.
      - name: generate placeholder icons
        run: |
          pip install pillow
          python scripts/gen-placeholder-icons.py

      # MUST precede cargo check: the context macro embeds frontendDist
      # (../dist) at compile time, and its absence fails with an error that
      # points nowhere near the cause.
      - name: build frontend
        run: pnpm build

      - name: cargo fmt
        working-directory: src-tauri
        run: cargo fmt --check

      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo check
        working-directory: src-tauri
        run: cargo check

      # cargo check does NOT compile or run #[cfg(test)] modules, so the unit
      # tests in src-tauri/src were sitting in the repository unexecuted. The
      # sidecar supervisor mints the session token, which ADR-0002 makes the
      # trust boundary; a test of that which never runs is worse than none,
      # because it reads like coverage.
      - name: cargo test
        working-directory: src-tauri
        run: cargo test

  coverage:
    name: coverage
    needs: inventory
    if: needs.inventory.outputs.sidecar == 'true'
    runs-on: ubuntu-latest
    # The job name is deliberately just "coverage" — stable — so branch
    # protection never has to be re-pointed when thresholds change. The
    # actual bars live in scripts/coverage_gate.py: statement >= 90 and
    # branch >= 80, enforced together. Measured on one target: coverage does
    # not vary by platform, and this is a gate, not a portability check.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: install sidecar (base + dev)
        run: |
          python -m pip install --upgrade pip
          pip install -e "sidecar[dev]"

      - name: coverage (statement + branch)
        run: pytest sidecar --cov=auditor_sidecar --cov-report=term-missing --cov-report=json

      - name: coverage gate (statement >= 90, branch >= 80)
        run: python scripts/coverage_gate.py

  reuse:
    name: reuse
    needs: inventory
    if: needs.inventory.outputs.licenses == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: fsfe/reuse-action@bb774aa972c2a89ff34781233d275075cbddf542  # v5.0.0

  ci-complete:
    name: ci-complete
    # The single fan-in context for branch protection. Requiring individual
    # jobs is brittle twice over: matrix job names change when the matrix
    # changes, and a required context that stops being reported leaves every
    # PR stuck on "Expected — waiting for status" with no failure to debug.
    # Protect THIS job: it runs unconditionally, depends on every other job,
    # and fails unless each one either succeeded or was skipped — one stable
    # name, reported on every PR, immune to renames above it.
    #
    # "skipped" is accepted, and the inventory printed below says why: either
    # the component is not in the repository yet, or the change does not
    # touch the desktop stack. A skip is never anonymous.
    if: always()
    needs: [inventory, lint, api-client, no-wire-parsing, test, build, coverage, reuse]
    runs-on: ubuntu-latest
    steps:
      - name: summary
        run: |
          echo "components present"
          echo "  sidecar  : ${{ needs.inventory.outputs.sidecar }}"
          echo "  frontend : ${{ needs.inventory.outputs.frontend }}"
          echo "  tauri    : ${{ needs.inventory.outputs.tauri }}"
          echo "  licenses : ${{ needs.inventory.outputs.licenses }}"
          echo
          echo "desktop stack touched by this change: ${{ needs.inventory.outputs.desktop }}"
          echo
          echo "job results"
          echo "  inventory       : ${{ needs.inventory.result }}"
          echo "  lint            : ${{ needs.lint.result }}"
          echo "  api-client      : ${{ needs['api-client'].result }}"
          echo "  no-wire-parsing : ${{ needs['no-wire-parsing'].result }}"
          echo "  test            : ${{ needs.test.result }}"
          echo "  build           : ${{ needs.build.result }}"
          echo "  coverage        : ${{ needs.coverage.result }}"
          echo "  reuse           : ${{ needs.reuse.result }}"

      - name: verify every job succeeded or was legitimately skipped
        run: |
          fail=0
          check() {  # $1 = job name, $2 = result
            case "$2" in
              success) ;;
              skipped) echo "note: $1 skipped — see the inventory above for why" ;;
              *)       echo "FAIL: $1 -> $2"; fail=1 ;;
            esac
          }
          check inventory       "${{ needs.inventory.result }}"
          check lint            "${{ needs.lint.result }}"
          check api-client      "${{ needs['api-client'].result }}"
          check no-wire-parsing "${{ needs['no-wire-parsing'].result }}"
          check test            "${{ needs.test.result }}"
          check build           "${{ needs.build.result }}"
          check coverage        "${{ needs.coverage.result }}"
          check reuse           "${{ needs.reuse.result }}"
          if [ "$fail" -ne 0 ]; then
            echo "one or more required CI jobs did not succeed"
            exit 1
          fi
          echo "ci-complete: ok"
