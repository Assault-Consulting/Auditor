name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least-privilege default: CI only needs to read the repo. Declared at the top
# level, with nothing more granted per job, so a compromised action cannot
# write to the repository or mint a token it was not given.
permissions:
  contents: read

jobs:
  # The scaffold arrives over several pull requests, so for a while this
  # workflow describes more of the repository than exists. Two ways to handle
  # that, and only one of them is honest.
  #
  # Leaving every job to fail until the last piece lands makes CI red on every
  # pull request for weeks, which trains everyone to merge past the red mark —
  # and once red is the normal colour, the first real failure is invisible.
  #
  # So each job is gated on the component it checks, and this job publishes
  # what is present. ci-complete prints the inventory on every run, so a green
  # tick is never anonymous: it always says which checks ran and which had
  # nothing to check. That is the same rule the ADR-0001 scan follows — it
  # reports how many files it scanned, because a guard that passes because it
  # looked at nothing is worse than no guard.
  inventory:
    name: inventory
    runs-on: ubuntu-latest
    outputs:
      sidecar: ${{ steps.probe.outputs.sidecar }}
      frontend: ${{ steps.probe.outputs.frontend }}
      tauri: ${{ steps.probe.outputs.tauri }}
      licenses: ${{ steps.probe.outputs.licenses }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - id: probe
        name: which components are present
        run: |
          probe() {  # $1 = name, $2 = path that must exist
            if [ -e "$2" ]; then
              echo "$1=true" >> "$GITHUB_OUTPUT"
              echo "present : $1  ($2)"
            else
              echo "$1=false" >> "$GITHUB_OUTPUT"
              echo "ABSENT  : $1  ($2) — dependent checks will not run"
            fi
          }
          probe sidecar  sidecar/pyproject.toml
          probe frontend package.json
          probe tauri    src-tauri/Cargo.toml
          probe licenses LICENSES

  lint:
    name: lint
    needs: inventory
    if: needs.inventory.outputs.sidecar == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      # Lint WITHOUT an editable install. With the package pip-installed,
      # ruff's isort classifies it as third-party and regroups first-party
      # imports differently than the src-layout heuristic does — passing
      # locally, failing only in CI. Linting a plain checkout keeps the
      # classification deterministic; `no-sections` in the isort config
      # closes the other half of the same hole.
      - name: install ruff only
        run: |
          python -m pip install --upgrade pip
          pip install ruff==0.16.2

      - name: ruff
        run: |
          ruff --version
          ruff check --output-format=full sidecar scripts

  no-wire-parsing:
    name: no-wire-parsing
    runs-on: ubuntu-latest
    # ADR-0001 made mechanical. Every PALA-1 fact this application renders
    # comes from a verifier call; nothing here parses container bytes. The
    # violation always arrives as a small, locally-reasonable helper inside
    # a larger PR, when the deadline is close. A grep does not get tired.
    #
    # Ungated: the scan handles an empty tree itself and says so, rather than
    # printing "ok" over a set of zero files.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: scan for wire-parsing primitives outside the seam
        run: |
          if [ -f scripts/check_no_wire_parsing.sh ]; then
            bash scripts/check_no_wire_parsing.sh
          else
            echo "ABSENT: scripts/check_no_wire_parsing.sh — nothing scanned"
          fi

  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    needs: inventory
    if: needs.inventory.outputs.sidecar == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-14, windows-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: install sidecar (base + dev)
        run: |
          python -m pip install --upgrade pip
          pip install -e "sidecar[dev]"

      - name: pytest
        run: pytest sidecar -q

  build:
    name: build (${{ matrix.platform }})
    needs: inventory
    if: needs.inventory.outputs.frontend == 'true' && needs.inventory.outputs.tauri == 'true'
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-22.04, macos-14, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: 20

      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda  # v4.1.0
        with:
          version: 9

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"

      - name: linux system deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: install frontend deps
        run: pnpm install --no-frozen-lockfile

      # The Tauri context macro reads icons/icon.png, and tauri-build wants
      # icon.ico on Windows — even with bundling disabled. Until a real logo
      # lands, generate branded placeholders.
      - name: generate placeholder icons
        run: |
          pip install pillow
          python scripts/gen-placeholder-icons.py

      # MUST precede cargo check: the context macro embeds frontendDist
      # (../dist) at compile time, and its absence fails with an error that
      # points nowhere near the cause.
      - name: build frontend
        run: pnpm build

      - name: cargo check
        working-directory: src-tauri
        run: cargo check

  coverage:
    name: coverage
    needs: inventory
    if: needs.inventory.outputs.sidecar == 'true'
    runs-on: ubuntu-latest
    # The job name is deliberately just "coverage" — stable — so branch
    # protection never has to be re-pointed when thresholds change. The
    # actual bars live in scripts/coverage_gate.py: statement >= 90 and
    # branch >= 80, enforced together. Measured on one target: coverage does
    # not vary by platform, and this is a gate, not a portability check.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: install sidecar (base + dev)
        run: |
          python -m pip install --upgrade pip
          pip install -e "sidecar[dev]"

      - name: coverage (statement + branch)
        run: pytest sidecar --cov=auditor_sidecar --cov-report=term-missing --cov-report=json

      - name: coverage gate (statement >= 90, branch >= 80)
        run: python scripts/coverage_gate.py

  reuse:
    name: reuse
    needs: inventory
    if: needs.inventory.outputs.licenses == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: fsfe/reuse-action@bb774aa972c2a89ff34781233d275075cbddf542  # v5.0.0

  ci-complete:
    name: ci-complete
    # The single fan-in context for branch protection. Requiring individual
    # jobs is brittle twice over: matrix job names change when the matrix
    # changes, and a required context that stops being reported leaves every
    # PR stuck on "Expected — waiting for status" with no failure to debug.
    # Protect THIS job: it runs unconditionally, depends on every other job,
    # and fails unless each one either succeeded or was skipped because its
    # component is not in the repository yet — one stable name, reported on
    # every PR, immune to renames above it.
    #
    # "skipped" is accepted, and every skip is printed with the component that
    # caused it. When the scaffold is complete nothing skips, and this summary
    # is how you notice if something silently starts skipping again.
    if: always()
    needs: [inventory, lint, no-wire-parsing, test, build, coverage, reuse]
    runs-on: ubuntu-latest
    steps:
      - name: summary
        run: |
          echo "components present"
          echo "  sidecar  : ${{ needs.inventory.outputs.sidecar }}"
          echo "  frontend : ${{ needs.inventory.outputs.frontend }}"
          echo "  tauri    : ${{ needs.inventory.outputs.tauri }}"
          echo "  licenses : ${{ needs.inventory.outputs.licenses }}"
          echo
          echo "job results"
          echo "  inventory       : ${{ needs.inventory.result }}"
          echo "  lint            : ${{ needs.lint.result }}"
          echo "  no-wire-parsing : ${{ needs['no-wire-parsing'].result }}"
          echo "  test            : ${{ needs.test.result }}"
          echo "  build           : ${{ needs.build.result }}"
          echo "  coverage        : ${{ needs.coverage.result }}"
          echo "  reuse           : ${{ needs.reuse.result }}"

      - name: verify every job succeeded or was legitimately skipped
        run: |
          fail=0
          check() {  # $1 = job name, $2 = result
            case "$2" in
              success) ;;
              skipped) echo "note: $1 skipped — its component is not in the repository yet" ;;
              *)       echo "FAIL: $1 -> $2"; fail=1 ;;
            esac
          }
          check inventory       "${{ needs.inventory.result }}"
          check lint            "${{ needs.lint.result }}"
          check no-wire-parsing "${{ needs['no-wire-parsing'].result }}"
          check test            "${{ needs.test.result }}"
          check build           "${{ needs.build.result }}"
          check coverage        "${{ needs.coverage.result }}"
          check reuse           "${{ needs.reuse.result }}"
          if [ "$fail" -ne 0 ]; then
            echo "one or more required CI jobs did not succeed"
            exit 1
          fi
          echo "ci-complete: ok"
