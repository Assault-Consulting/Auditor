[project]
name = "palimpsests-auditor-sidecar"
version = "0.0.1"
description = "Palimpsests Auditor sidecar — the reader-side service"
requires-python = ">=3.11"
license = "Apache-2.0"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    # Per-OS data dir resolution for anchor profiles, UI preferences and
    # (Phase 2) the local witness log.
    "platformdirs>=4.3",
    # THE verifier. Every PALA-1 fact this application renders comes from
    # here, through auditor_sidecar.pala_seam and nowhere else (ADR-0001).
    # [pala] adds cryptography for encrypted record bodies; header-only
    # verification is stdlib and needs nothing.
    #
    # 0.12.0 closes the findings reported from this repository while
    # wiring 0.11.0 in: the PKCS#11 no-PIN read (F1, a security fix) and
    # its missing-extra escape (F2), the unlocked decode cache (F3), and
    # build_report silently dropping an anchor passed with a reader (F4).
    # It also changes acknowledged_candidates() from a set to a
    # dict[candidate_seq, ack_seq] (#236) — breaking for set algebra,
    # which nothing here does; membership reads the same.
    #
    # What it does and does not do for U14, measured here on a 1M-record
    # (250 MB) chain rather than taken from the changelog: verify() plus
    # build_report(reader=) takes 11.3 s / 421 MB, where 0.11.0 could
    # not finish; records() still materialises every record (16.9 s,
    # 1.9 GB), and that is the path this seam still walks for record
    # windows, timelines and subject counts. C-10b is therefore mostly
    # this side's work now — see DEVELOPMENT-PLAN.md.
    "palimpsests[pala]>=0.12,<0.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    # FastAPI's TestClient is a thin layer over httpx.
    "httpx>=0.27",
    # Pinned exactly, not lower-bounded: lint behaviour changes between patch
    # releases, and a local/CI disagreement on lint is a whole afternoon.
    "ruff==0.16.2",
    # The keychain anchor source is exercised against an in-memory store, but
    # the module still imports `keyring.errors`, so the dev environment needs
    # the extra's dependency. Tests never touch a real backend: an autouse
    # fixture in conftest replaces the importer for every test in the suite.
    "keyring>=25.0",
]
# PDF report rendering (D-02). Isolated behind an extra so the report path
# stays fully testable as JSON without a renderer installed, and so the base
# surface does not grow a heavy dependency for a Phase 3 feature.
report = [
    "reportlab>=4.2",
]
# OS keychain as an anchor source (B-05). The core package deliberately does
# not carry this dependency — its placement rule puts non-stdlib sources with
# their consumer — so it lives here, and behind an extra so a plain install
# does not require a Secret Service daemon to be present.
keyring = [
    "keyring>=25.0",
]
# A PKCS#11 token as an anchor source (B-12, ADR-0004 upstream). Defers to
# the package's own [pkcs11] extra so the python-pkcs11 bound is theirs, not
# a second one kept here to drift. keyring comes with it because the token
# PIN is read from the OS keychain rather than stored in a profile — see
# Pkcs11PinnedAnchor for why. A plain install needs neither: every other
# anchor source works without them, and a pkcs11 source configured without
# the extra reports "error" for its own link rather than failing the check.
pkcs11 = [
    "palimpsests[pkcs11]>=0.12,<0.13",
    "keyring>=25.0",
]

[project.scripts]
palimpsests-auditor-sidecar = "auditor_sidecar.main:run"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["auditor_sidecar*"]

# Lint configuration lives in the repository-root ruff.toml so that the
# sidecar package and the CI scripts are held to one set of rules. A
# [tool.ruff] block here would silently take precedence for this subtree and
# reintroduce the split.

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.coverage.run]
source = ["auditor_sidecar"]
# Branch coverage on: the gate enforces statement and branch together, and a
# refusal path is exactly the kind of branch statement coverage misses.
branch = true

[tool.coverage.report]
show_missing = true
precision = 1
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
